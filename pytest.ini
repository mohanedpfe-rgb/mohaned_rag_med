[pytest]
pythonpath = .
testpaths = tests
addopts = --import-mode=importlib --strict-markers
markers =
    fast: deterministic checks intended to complete quickly
    unit: isolated unit-level behavior
    contract: public API and cross-module contract tests
    diagnostic: tests whose primary purpose is locating the first broken contract
    regression: previously broken behavior that must never regress
    ingestion: PDF discovery, extraction, chunking, indexing and replacement
    retrieval: semantic, lexical and hybrid retrieval behavior
    intelligence: query, grounding, reasoning, and answer-engine tests
    generation: answer generation, citation and final-answer contracts
    storage: vector-store, lexical-index, persistence, repair and consistency tests
    integration: integration tests requiring external services or full system wiring
    slow: long-running behavior tests
    requires_ollama: tests that require a live Ollama service
    high_level: project-specific user-visible behavior suite
