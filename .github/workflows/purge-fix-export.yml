name: Purge Fix Export
on:
  push:
    branches: [purge-fix-2026-09-13]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - name: Apply safe static cleanup
        run: |
          set +e
          ruff check . --select F401,F841 --fix
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
      - name: Fix remaining proven defects
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected cleanup pattern not found: {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "rag_project/runtime_hardening_extra.py",
              "from __future__ import annotations\n\nimport hashlib",
              "from __future__ import annotations\n\nfrom datetime import datetime, timezone\n\nimport hashlib",
          )
          replace_once(
              "rag_project/runtime_hardening_extra.py",
              "ROOT = Path(__file__).resolve().parents[1]\n",
              "ROOT = Path(__file__).resolve().parents[1]\n\n\ndef utc_now() -> str:\n    return datetime.now(timezone.utc).isoformat()\n",
          )
          advanced = Path("rag_project/testing/advanced_phases.py")
          text = advanced.read_text(encoding="utf-8")
          if "import subprocess\n" not in text:
              text = text.replace("import statistics\n", "import statistics\nimport subprocess\n", 1)
              advanced.write_text(text, encoding="utf-8")

          replace_once(
              "rag_project/intelligence/deep_pdf_contract.py",
              "    original_init = SemanticChunker.__init__\n    SemanticChunker.__init__ = self_init = _init_wrapper(None, original_init) if False else (lambda self, *args, **kwargs: None)\n    # Replace with a real wrapper without lambda indirection so introspection remains useful.\n",
              "    original_init = SemanticChunker.__init__\n",
          )
          replace_once(
              "rag_project/app/rag_system.py",
              "        embedding_profile = self.embedding_service.identity\n",
              "",
          )
          replace_once(
              "rag_project/app/rag_system.py",
              "            cited_markers = set(range(1, len(selected_hits) + 1))\n",
              "",
          )
          replace_once(
              "rag_project/app/resilient_rag.py",
              "        ids = _as_list(records.get(\"ids\"))\n",
              "",
          )
          replace_once(
              "rag_project/evaluation/runner.py",
              "            candidate_count = max(raw_top_k * 5, 20)\n",
              "",
          )
          replace_once(
              "rag_project/ingestion/atomic_claim.py",
              "    database_path = store.database_path\n",
              "",
          )
          replace_once(
              "rag_project/intelligence/structure_anchor_runtime.py",
              "            base_meta = self.collection.metadata or {}\n",
              "",
          )
          replace_once(
              "rag_project/testing/strict_phases.py",
              "        safety = SafetyDecision(\"PROCEED\", \"in_scope\", .75)\n",
              "",
          )
          replace_once(
              "tests/test_hardening.py",
              "    state_db = tmp_path / \"state.sqlite3\"\n",
              "",
          )
          replace_once(
              "tests/test_retrieval_behavior_diagnostics.py",
              "    vector_row = (\"v\", \"vector\", {\"document_id\": \"v\"}, 0.1)\n",
              "",
          )

          # The test's MonkeyPatch context is unused; retain the actual assertion/body.
          test_path = Path("tests/test_production_functionality_matrix.py")
          text = test_path.read_text(encoding="utf-8")
          old = '''        with pytest.MonkeyPatch.context() as patch:\n            # os-level temp directory through pathlib keeps this test dependency-free.\n            import tempfile\n\n            with tempfile.TemporaryDirectory() as tmp:\n                directory = Path(tmp) / "folder.pdf"\n                directory.mkdir()\n                robust_ingest_file(SimpleNamespace(), directory)\n'''
          new = '''        # os-level temp directory through pathlib keeps this test dependency-free.\n        import tempfile\n\n        with tempfile.TemporaryDirectory() as tmp:\n            directory = Path(tmp) / "folder.pdf"\n            directory.mkdir()\n            robust_ingest_file(SimpleNamespace(), directory)\n'''
          if old not in text:
              raise SystemExit("expected MonkeyPatch cleanup pattern not found")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify syntax
        run: python -m compileall -q .
      - name: Remove temporary purge workflow and commit cleanup
        run: |
          rm -f .github/workflows/purge-fix-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "purge: remove mechanically dead code and repair static defects"
          git push origin HEAD:purge-fix-2026-09-13
