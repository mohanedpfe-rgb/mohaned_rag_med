name: Purge Fix Export
on:
  push:
    branches: [purge-fix-2026-09-13]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - name: Apply only mechanically safe Ruff fixes
        run: |
          set +e
          ruff check . --select F401,F841 --fix
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      - name: Verify syntax after safe fixes
        run: python -m compileall -q .
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "No safe Ruff changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "purge: remove mechanically provable dead imports and assignments"
          git push origin HEAD:purge-fix-2026-09-13
