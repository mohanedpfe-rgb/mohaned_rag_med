name: PDF Architecture Gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pdf-architecture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Compile source
        run: python -m compileall -q rag_project app.py run_dev.py scripts
      - name: Run 45-point PDF architecture contract
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "true"
          EMBEDDING_TEST_MODE: "true"
          PDF_CONTRACT_REVISION: "4"
        run: python -m pytest -q tests/test_pdf_45_contract.py tests/test_deep_pdf_architecture.py tests/test_universal_pdf_knowledge_model.py
