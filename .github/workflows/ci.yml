name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  diagnostic-17-phase-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Validate installed environment
        run: python -m pip check
      - name: Compile diagnostic system
        run: python -m compileall -q rag_project/testing
      - name: Run authoritative full 17-phase diagnostic
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "true"
          EMBEDDING_TEST_MODE: "true"
          REQUIRE_REAL_OCR: "true"
        run: python scripts/test_doctor.py --deep --json artifacts/diagnostic-17-phase.json
      - name: Require strict 17/17 certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/diagnostic-17-phase.json").read_text(encoding="utf-8"))
          phases = report.get("phases", [])
          assert len(phases) == 17, f"expected 17 phase results, got {len(phases)}"
          numbers = sorted(item["number"] for item in phases)
          assert numbers == list(range(1, 18)), numbers
          non_pass = [item for item in phases if item.get("status") != "PASS"]
          assert not non_pass, f"every phase must PASS: {non_pass}"
          phase17 = next(item for item in phases if item["number"] == 17)
          details = phase17.get("details", {})
          assert details.get("implementation_coverage") == "17/17", phase17
          assert not details.get("missing_phase_results"), phase17
          assert not details.get("evidence_failures"), phase17
          assert not details.get("runtime_non_pass_phases"), phase17
          assert phase17.get("status") == "PASS", phase17
          assert report.get("status") == "PASS", report
          print("STRICT 17/17 CERTIFICATION VERIFIED")
          PY
      - name: Publish strict 17-phase diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-17-phase
          path: artifacts/diagnostic-17-phase.json
          if-no-files-found: ignore

  high-level-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest-xdist
      - name: Validate installed environment
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q rag_project app.py run_dev.py scripts
      - name: Validate two-plan test inventory
        run: python scripts/validate_test_inventory.py
      - name: Run parallel high-level fast gate (60 second budget)
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "true"
          EMBEDDING_TEST_MODE: "true"
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import time

          command = [
              sys.executable,
              "-m",
              "pytest",
              "tests/high_level",
              "-m",
              "high_level and not slow",
              "-n",
              "auto",
              "--dist",
              "loadscope",
              "--durations=20",
              "-q",
          ]
          started = time.perf_counter()
          completed = subprocess.run(command, check=False)
          elapsed = time.perf_counter() - started
          print(f"HIGH_LEVEL_FAST_WALL_CLOCK_SECONDS={elapsed:.2f}")
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)
          if elapsed > 60.0:
              print(
                  f"HIGH_LEVEL_FAST_BUDGET_EXCEEDED: {elapsed:.2f}s > 60.00s",
                  file=sys.stderr,
              )
              raise SystemExit(78)
          print("HIGH_LEVEL_FAST_60S_BUDGET_VERIFIED")
          PY

  regression-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Validate installed environment
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q rag_project app.py run_dev.py scripts
      - name: Validate two-plan test inventory
        run: python scripts/validate_test_inventory.py
      - name: Run existing regression and contract suite
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "false"
          EMBEDDING_TEST_MODE: "true"
        run: python -m pytest -q tests --ignore=tests/high_level

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Install audit tooling
        run: python -m pip install --upgrade pip-audit
      - name: Audit resolved runtime dependencies
        run: |
          python -m pip_audit --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
