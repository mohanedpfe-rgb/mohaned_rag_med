name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The source constraints are the CI compatibility baseline.
          # The generated lockfile is validated separately by the lock workflow.
          python -m pip install -r requirements.txt
      - name: Validate installed environment
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q rag_project app.py run_dev.py
      - name: Run tests
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "false"
          EMBEDDING_TEST_MODE: "true"
        run: python -m pytest -q

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit locked runtime dependencies
        run: |
          # ChromaDB's current 2026 authorization/code-injection advisories have
          # no patched upstream release yet; keep these explicitly tracked while
          # failing the build on every other known vulnerability.
          python -m pip_audit -r requirements.lock --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
