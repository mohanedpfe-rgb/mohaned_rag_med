name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  diagnostic-fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Validate installed environment
        run: python -m pip check
      - name: Run authoritative fast diagnostic
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "false"
          EMBEDDING_TEST_MODE: "true"
        run: python scripts/test_doctor.py --fast --fail-fast --json artifacts/diagnostic-fast.json
      - name: Publish fast diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-fast
          path: artifacts/diagnostic-fast.json
          if-no-files-found: ignore

  high-level-behavior:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Validate installed environment
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q rag_project app.py run_dev.py scripts
      - name: Validate two-plan test inventory
        run: python scripts/validate_test_inventory.py
      - name: Run high-level behavior suite (primary gate)
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "true"
          EMBEDDING_TEST_MODE: "true"
        run: python -m pytest -q tests/high_level -m high_level

  regression-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Validate installed environment
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q rag_project app.py run_dev.py scripts
      - name: Validate two-plan test inventory
        run: python scripts/validate_test_inventory.py
      - name: Run existing regression and contract suite
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "false"
          EMBEDDING_TEST_MODE: "true"
        run: python -m pytest -q tests --ignore=tests/high_level

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Install audit tooling
        run: python -m pip install --upgrade pip-audit
      - name: Audit resolved runtime dependencies
        run: |
          python -m pip_audit --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
