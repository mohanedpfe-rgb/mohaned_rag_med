name: Canva calibration

on:
  push:
    branches: [ui/canva-studio-redesign]

permissions:
  contents: write

jobs:
  calibrate:
    if: "!contains(github.event.head_commit.message, '[canva-calibration]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calibrate Studio UI to 1920x1080 prototype
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rag_project/app/studio_ui.py')
          s = p.read_text()
          s = s.replace(
              'NAV_ITEMS = ["Overview", "Ingestion", "Inspector", "Settings", "Chat", "Health", "Background"]',
              'NAV_ITEMS = ["Overview", "Documents", "Index them", "Ingestion", "Inspector", "Settings"]\nSECONDARY_NAV_ITEMS = ["Chat", "Health", "Background"]',
          )
          s = s.replace(
              'def _navigate(page: str) -> None:\n    if page in NAV_ITEMS:\n        st.session_state["studio_nav"] = page\n        st.rerun()\n',
              'def _navigate(page: str) -> None:\n    aliases = {"Documents": "Overview", "Index them": "Ingestion"}\n    target = aliases.get(page, page)\n    if target in NAV_ITEMS or target in SECONDARY_NAV_ITEMS:\n        st.session_state["studio_nav"] = target\n        st.rerun()\n',
          )
          s = s.replace(
              '[data-testid="stSidebar"]{width:252px!important;background:rgba(13,20,34,.98)!important;border-right:1px solid var(--stroke)!important}',
              '[data-testid="stSidebar"]{position:fixed!important;left:91px!important;top:112px!important;width:251px!important;height:855px!important;background:rgba(13,20,34,.985)!important;border:0!important;border-radius:0!important;z-index:20!important;box-shadow:none!important}\n[data-testid="stSidebar"]:before{content:"";position:absolute;left:0;top:0;width:251px;height:855px;border-right:1px solid var(--stroke);pointer-events:none}\n[data-testid="stAppViewContainer"]{background:transparent!important}\n[data-testid="stAppViewContainer"]:before{content:"";position:fixed;left:91px;top:112px;width:1738px;height:855px;border:1px solid #263449;border-radius:20px;background:#0d1422;box-shadow:0 28px 70px rgba(0,0,0,.30);pointer-events:none;z-index:0}\nsection.main{position:relative!important;z-index:2!important;margin-left:0!important}',
          )
          s = s.replace(
              '[data-testid="stSidebar"]>div:first-child{padding:23px 23px!important}',
              '[data-testid="stSidebar"]>div:first-child{padding:23px 23px!important;height:100%!important;overflow:hidden!important}',
          )
          s = s.replace(
              '.block-container{max-width:1738px!important;padding:23px 46px 56px!important}',
              '.block-container{box-sizing:border-box!important;width:1441px!important;max-width:1441px!important;margin-left:342px!important;margin-right:0!important;padding:23px 46px 56px!important}',
          )
          s = s.replace(
              '.panel{border:1px solid var(--stroke);border-radius:16px;background:rgba(17,26,42,.82);box-shadow:0 12px 32px rgba(0,0,0,.11);padding:18px;margin-bottom:12px}',
              '.panel{border:1px solid var(--stroke);border-radius:16px;background:rgba(17,26,42,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(0,0,0,.11);padding:18px;margin-bottom:12px}',
          )
          s = s.replace(
              '.metric-card{position:relative;min-height:112px;border:1px solid var(--stroke);border-radius:14px;background:linear-gradient(180deg,rgba(21,31,49,.9),rgba(14,22,36,.92));padding:17px;box-shadow:0 13px 30px rgba(0,0,0,.14)}',
              '.metric-card{position:relative;min-height:112px;border:1px solid var(--stroke);border-radius:14px;background:linear-gradient(180deg,rgba(21,31,49,.9),rgba(14,22,36,.92));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:17px;box-shadow:0 13px 30px rgba(0,0,0,.14)}',
          )
          s = s.replace(
              '.top-chip{height:34px;padding:0 12px;border:1px solid var(--stroke);border-radius:10px;background:rgba(17,26,42,.72);display:flex;align-items:center;color:#b8c2d1;font-size:11px;font-weight:750}',
              '.top-chip{height:34px;padding:0 12px;border:1px solid var(--stroke);border-radius:10px;background:rgba(17,26,42,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;color:#b8c2d1;font-size:11px;font-weight:750}',
          )
          s = s.replace(
              '        for item in NAV_ITEMS:\n            label = ("●  " if item == current else "○  ") + item\n            if st.button(label, key=f"nav_{item}", use_container_width=True):\n                _navigate(item)\n',
              '        for item in NAV_ITEMS:\n            label = ("●  " if item == current else "○  ") + item\n            if st.button(label, key=f"nav_{item}", use_container_width=True):\n                _navigate(item)\n        st.markdown("<div class=\\"nav-label\\">Tools</div>", unsafe_allow_html=True)\n        for item in SECONDARY_NAV_ITEMS:\n            label = ("●  " if item == current else "○  ") + item\n            if st.button(label, key=f"nav_secondary_{item}", use_container_width=True):\n                _navigate(item)\n',
          )
          s = s.replace(
              '@media(max-width:1200px){.content-grid{grid-template-columns:1fr}.metric-row{grid-template-columns:repeat(3,1fr)}}',
              '@media(max-width:1919px){[data-testid="stAppViewContainer"]:before{left:24px;width:calc(100vw - 48px)}[data-testid="stSidebar"]{left:24px!important}.block-container{width:calc(100vw - 431px)!important;max-width:none!important;margin-left:275px!important}}@media(max-width:1200px){.content-grid{grid-template-columns:1fr}.metric-row{grid-template-columns:repeat(3,1fr)}}',
          )
          p.write_text(s)
          PY
      - name: Commit calibrated UI and remove calibration workflow
        run: |
          rm -f .github/workflows/canva_calibrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rag_project/app/studio_ui.py .github/workflows/canva_calibrate.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(ui): lock BookRAG shell to Canva geometry [canva-calibration]"
          git push
