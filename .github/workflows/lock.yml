name: Dependency Lock

on:
  push:
    branches: [master]
    paths:
      - requirements.in
      - requirements.txt
      - .github/workflows/lock.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-lock-master
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      # Resolve from the lowest supported Python so the shared lock remains
      # installable on every supported interpreter (3.11 and 3.12).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Resolve lockfile
        run: uv pip compile requirements.in --python 3.11 --generate-hashes --output-file requirements.lock
      - name: Validate lock on all supported Python versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r requirements.lock
      - name: Require committed lockfile to be current
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "requirements.lock is current"
          else
            echo "requirements.lock is stale; run the lock resolver locally and commit the generated lockfile."
            git diff -- requirements.lock
            exit 1
          fi
