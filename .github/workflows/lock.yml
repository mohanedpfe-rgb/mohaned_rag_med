name: Dependency Lock

on:
  push:
    branches: [master]
    paths:
      - requirements.in
      - requirements.txt
      - .github/workflows/lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lock-master
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Resolve lockfile
        run: uv pip compile requirements.in --generate-hashes --output-file requirements.lock
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "requirements.lock is already current"
          else
            git commit -m "chore: refresh dependency lockfile"
            git push origin HEAD:master
          fi
