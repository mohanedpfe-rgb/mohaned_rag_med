name: High-Level Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  nightly-high-level:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Run high-level slow scenarios
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "false"
          EMBEDDING_TEST_MODE: "true"
        run: python -m pytest -q tests/high_level -m "high_level and slow"
      - name: Check Ollama availability
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 5 http://127.0.0.1:11434/api/tags
      - name: Run optional real-Ollama tests when available
        env:
          DEVICE_MODE: i5_16gb
        run: python -m pytest -q tests/high_level -m "high_level and requires_ollama" --maxfail=1
