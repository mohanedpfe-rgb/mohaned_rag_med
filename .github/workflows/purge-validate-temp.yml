name: Temporary Purge Validation
on:
  push:
    branches:
      - purge-clean-2026-09-13
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Compile source
        run: python -m compileall -q rag_project app.py run_dev.py scripts
      - name: Static correctness rules
        run: |
          python -m pip install ruff vulture
          ruff check rag_project app.py run_dev.py scripts tests --select F401,F841,F821,F811
          vulture rag_project app.py run_dev.py scripts tests --min-confidence 100
      - name: PDF architecture contracts
        env:
          DEVICE_MODE: i5_16gb
          OCR_ENABLED: "true"
          EMBEDDING_TEST_MODE: "true"
          PDF_CONTRACT_REVISION: "4"
        run: python -m pytest -q tests/test_pdf_45_contract.py tests/test_deep_pdf_architecture.py tests/test_universal_pdf_knowledge_model.py
      - name: Full regression suite
        run: python -m pytest -q
